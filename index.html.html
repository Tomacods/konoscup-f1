<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KonosCup - F1 25</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0E1424;
      color: #EEF1F8;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #161E33;
      border-bottom: 1px solid #27314F;
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8B96B4;
      margin: 0.25rem 0 0 0;
    }

    .mode-toggle {
      padding: 0.5rem 1rem;
      background: rgba(212, 245, 66, 0.2);
      color: #D4F542;
      border: 1px solid #D4F542;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.875rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .panel {
      background: #161E33;
      border-radius: 0.5rem;
      overflow: hidden;
      padding: 1.5rem;
    }

    .row {
      display: grid;
      grid-template-columns: 2rem 1fr 4rem 5rem;
      gap: 1rem;
      align-items: center;
      padding: 1rem 0;
      border-top: 1px solid #27314F;
    }

    .row:first-child {
      border-top: none;
      padding-top: 0;
    }

    .pos {
      font-weight: bold;
      color: #8B96B4;
      font-size: 0.875rem;
    }

    .pilot-name {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .team-bar {
      width: 4px;
      height: 20px;
      border-radius: 2px;
    }

    .team-name {
      font-size: 0.75rem;
      color: #8B96B4;
      margin-top: 0.25rem;
    }

    .stats {
      text-align: right;
      color: #8B96B4;
      font-size: 0.875rem;
    }

    .points {
      text-align: right;
      font-size: 1.5rem;
      font-weight: bold;
      font-family: ui-monospace, monospace;
    }

    .message {
      background: rgba(212, 245, 66, 0.1);
      color: #D4F542;
      padding: 0.75rem 1rem;
      text-align: center;
      font-size: 0.875rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }

    .message.error {
      background: rgba(232, 0, 45, 0.1);
      color: #E8002D;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #8B96B4;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .row {
        grid-template-columns: 2rem 1fr 3rem;
      }
      .stats {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div>
        <h1>🏁 KonosCup</h1>
        <p class="subtitle" id="raceCount">Cargando...</p>
      </div>
    </div>
  </header>

  <main>
    <div id="message"></div>
    <section>
      <h2>Campeonato</h2>
      <div class="panel" id="standings">
        <div class="loading">Cargando datos...</div>
      </div>
    </section>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>

  <script>
    // ========== CONFIGURACIÓN FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDA7EzLZo7n_Gke-AzJNu3zJRPCx__n8Hc",
      authDomain: "konoscup-f1.firebaseapp.com",
      projectId: "konoscup-f1",
      storageBucket: "konoscup-f1.firebasestorage.app",
      messagingSenderId: "474297070575",
      appId: "1:474297070575:web:885ef9a3178f713efbfc1a"
    };

    // Inicializar Firebase
    let db = null;
    let state = null;

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();

    // ========== DATOS BASE ==========
    const TEAMS = [
      { name: "McLaren", color: "#FF8000" },
      { name: "Ferrari", color: "#E8002D" },
      { name: "Red Bull", color: "#3671C6" },
      { name: "Mercedes", color: "#27F4D2" },
      { name: "Aston Martin", color: "#229971" },
      { name: "Alpine", color: "#0093CC" },
      { name: "Haas", color: "#B6BABD" },
      { name: "Racing Bulls", color: "#6692FF" },
      { name: "Williams", color: "#64C4FF" },
      { name: "Kick Sauber", color: "#52E252" },
    ];

    const RACES = [
      ["Australia", "MEL"], ["China", "SHA"], ["Japón", "SUZ"], ["Baréin", "SAK"],
      ["Arabia Saudita", "JED"], ["Miami", "MIA"], ["Emilia-Romaña", "IMO"], ["Mónaco", "MON"],
      ["España", "BCN"], ["Canadá", "MTL"], ["Austria", "SPI"], ["Gran Bretaña", "SIL"],
      ["Bélgica", "SPA"], ["Hungría", "BUD"], ["Países Bajos", "ZAN"], ["Italia", "MNZ"],
      ["Azerbaiyán", "BAK"], ["Singapur", "SIN"], ["Estados Unidos", "AUS"], ["México", "MEX"],
      ["Brasil", "INT"], ["Las Vegas", "LVG"], ["Qatar", "LUS"], ["Abu Dabi", "YAS"],
    ];

    const DEFAULT_POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

    const DEFAULT_DRIVERS = [
      { id: "d1", name: "Tomacods", team: "McLaren", adj: 0 },
      { id: "d2", name: "Cesarmi13", team: "Ferrari", adj: 0 },
      { id: "d3", name: "Facuzera", team: "Alpine", adj: 0 },
      { id: "d4", name: "SoloLuko", team: "Red Bull", adj: 0 },
      { id: "d5", name: "lucasbenax", team: "McLaren", adj: 0 },
      { id: "d6", name: "chinaty11", team: "Red Bull", adj: 0 },
      { id: "d7", name: "Boy-Jager", team: "Ferrari", adj: 0 },
    ];

    // ========== HELPERS ==========
    function teamColor(t) {
      return TEAMS.find(x => x.name === t)?.color || "#8B93AD";
    }

    function pointsFor(pos) {
      return (pos && pos >= 1 && pos <= 10) ? state.points[pos - 1] || 0 : 0;
    }

    function posOf(id, i) {
      return (state.results[id] && state.results[id][i]) || null;
    }

    function getStandings() {
      const rows = state.drivers.map((d) => {
        const perRace = RACES.map((_, i) => pointsFor(posOf(d.id, i)));
        const finishes = {};
        RACES.forEach((_, i) => {
          const p = posOf(d.id, i);
          if (p) finishes[p] = (finishes[p] || 0) + 1;
        });
        const raced = RACES.filter((_, i) => posOf(d.id, i)).length;
        const base = perRace.reduce((a, b) => a + b, 0);
        return {
          ...d,
          perRace,
          finishes,
          raced,
          wins: finishes[1] || 0,
          base,
          total: base + (Number(d.adj) || 0),
        };
      });
      rows.sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        for (let p = 1; p <= 20; p++) {
          const ca = a.finishes[p] || 0, cb = b.finishes[p] || 0;
          if (cb !== ca) return cb - ca;
        }
        return a.name.localeCompare(b.name);
      });
      return rows;
    }

    function getDoneRaces() {
      return RACES.filter((_, i) => state.drivers.some((d) => posOf(d.id, i))).length;
    }

    // ========== RENDER ==========
    function render() {
      if (!state) return;

      const standings = getStandings();
      const doneRaces = getDoneRaces();

      document.getElementById("raceCount").textContent = `${doneRaces} de ${RACES.length} carreras`;

      const html = standings.map((r, idx) => `
        <div class="row">
          <div class="pos">${idx + 1}</div>
          <div>
            <div class="pilot-name">
              <span class="team-bar" style="background: ${teamColor(r.team)}"></span>
              ${r.name}
            </div>
            <div class="team-name">${r.team}</div>
          </div>
          <div class="stats">
            ${r.wins > 0 ? `🏆 ${r.wins}` : ""} ${r.raced} carreras
          </div>
          <div class="points">${r.total}</div>
        </div>
      `).join("");

      document.getElementById("standings").innerHTML = html || '<div class="loading">Sin datos aún</div>';
    }

    function showMessage(msg, isError = false) {
      const el = document.getElementById("message");
      el.innerHTML = `<div class="message ${isError ? 'error' : ''}">${msg}</div>`;
      setTimeout(() => {
        el.innerHTML = "";
      }, 3000);
    }

    // ========== FIREBASE LISTENER ==========
    async function init() {
      try {
        showMessage("🔄 Conectando a Firebase...");

        // Cargar datos iniciales
        const doc = await db.collection("konoscup").doc("v1").get();
        
        if (doc.exists) {
          state = doc.data();
          showMessage("✓ Sincronizado desde Firebase");
        } else {
          state = {
            drivers: DEFAULT_DRIVERS,
            results: {},
            points: DEFAULT_POINTS,
          };
          showMessage("ℹ️ Usando datos por defecto");
        }

        render();

        // Escuchar cambios en tiempo real
        db.collection("konoscup").doc("v1").onSnapshot((doc) => {
          if (doc.exists) {
            state = doc.data();
            render();
          }
        }, (error) => {
          console.error("Error escuchando Firebase:", error);
          showMessage("⚠️ Error sincronizando", true);
        });

      } catch (error) {
        console.error("Error:", error);
        showMessage("❌ Error: " + error.message, true);
      }
    }

    // Iniciar cuando cargue
    init();
  </script>
</body>
</html>
